name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RENPY_VERSION: "8.5.3"
  FREEDOOM_VERSION: "0.13.0"

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gate: no SDK, no GPU, no IWAD.  Checks that the committed game data
  # is self-consistent and that the WAD decoders still behave.
  # ---------------------------------------------------------------------------
  data:
    name: Data consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt

      - name: Byte-compile the tools
        run: python -m compileall -q tools

      - name: Self-test the WAD decoders
        run: python tools/selftest_wadlib.py

      - name: Verify generated game data
        run: python tools/verify_assets.py

  # ---------------------------------------------------------------------------
  # Ren'Py's own static analysis.  Catches broken screens, unknown images,
  # unreachable labels and font mismatches.
  # ---------------------------------------------------------------------------
  lint:
    name: Ren'Py lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-renpy
        with:
          version: ${{ env.RENPY_VERSION }}

      - name: Lint
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          "$RENPY_SH" . lint 2>&1 | tee lint.log
          # A clean lint report must mention the game and no errors.
          grep -q "dialogue blocks" lint.log

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The real thing: plays the game from the main menu to the credits on a
  # virtual X server, and keeps the screenshots as evidence.
  # ---------------------------------------------------------------------------
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-renpy
        with:
          version: ${{ env.RENPY_VERSION }}

      - name: Install a virtual display and software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libgl1-mesa-dri libglu1-mesa fonts-dejavu-core

      - name: Run the game end to end
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$RENPY_SH" . test smoke 2>&1 | tee smoke.log

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: smoke.log
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: tests/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if no screenshots were captured
        run: |
          count=$(find tests/screenshots -name '*.png' 2>/dev/null | wc -l)
          echo "captured $count screenshot(s)"
          if [ "$count" -lt 5 ]; then
            echo "::error::expected the smoke test to capture screenshots"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The release is built from FreeDoom, so every push proves that path still
  # works: rebuild the assets from freedoom2.wad, then lint and play the result.
  # Skipped on pull requests to keep review feedback fast.
  # ---------------------------------------------------------------------------
  freedoom:
    name: FreeDoom build
    runs-on: ubuntu-latest
    needs: data
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: ./.github/actions/setup-renpy
        with:
          version: ${{ env.RENPY_VERSION }}

      - name: Install the asset pipeline
        run: python -m pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Fetch FreeDoom
        run: |
          set -euo pipefail
          url="https://github.com/freedoom/freedoom/releases/download/v${FREEDOOM_VERSION}/freedoom-${FREEDOOM_VERSION}.zip"
          curl -fsSL --retry 3 -o freedoom.zip "$url"
          python - <<'PY'
          import os, zipfile
          with zipfile.ZipFile("freedoom.zip") as z:
              name = next(n for n in z.namelist() if n.endswith("freedoom2.wad"))
              z.extract(name, "freedoom")
              os.replace(os.path.join("freedoom", name), "freedoom2.wad")
          print("freedoom2.wad extracted")
          PY

      - name: Rebuild the assets from FreeDoom
        run: |
          python tools/build_assets.py --iwad freedoom2.wad --out .
          python tools/gen_images_rpy.py
          python tools/verify_assets.py

      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libgl1-mesa-dri libglu1-mesa fonts-dejavu-core

      - name: Show which Cyrillic font the pipeline picked
        run: python -c "import sys; sys.path.insert(0,'tools'); import importlib.util as u; s=u.spec_from_file_location('b','tools/build_assets.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print('TTF ->', m.find_cyrillic_ttf())"

      - name: Lint and play the FreeDoom build
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          export SDL_VIDEODRIVER=dummy
          "$RENPY_SH" . lint 2>&1 | tee freedoom-lint.log
          grep -q "dialogue blocks" freedoom-lint.log

          unset SDL_VIDEODRIVER
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$RENPY_SH" . test smoke 2>&1 | tee freedoom-smoke.log

      - name: Upload the FreeDoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freedoom-build
          path: |
            freedoom-lint.log
            freedoom-smoke.log
            tests/screenshots
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Packaged builds.  The assets are committed, so this needs no IWAD - which
  # matters, because DOOM2.WAD must never reach CI.
  # ---------------------------------------------------------------------------
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-renpy
        with:
          version: ${{ env.RENPY_VERSION }}

      - name: Build
        run: |
          set -o pipefail
          "$RENPY_SH" "$RENPY_SDK/launcher" distribute . \
            --destination dist \
            --no-update \
            --package win \
            --package linux \
            --package mac \
            2>&1 | tee build.log

      - name: List the result
        run: |
          ls -lh dist
          test -n "$(ls -A dist)"

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: doom-novell-${{ github.sha }}
          path: dist/*
          retention-days: 14

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
