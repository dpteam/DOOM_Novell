name: Release

# Tag the repository (git tag v1.1.0 && git push --tags) and this builds the
# packaged game, checks the tag against config.version, and publishes a GitHub
# release with the archives attached.
#
# The release is built from FreeDoom assets, not from DOOM2.WAD.  The assets
# committed to this repository were extracted from the retail IWAD and are
# covered by id Software's copyright, which makes them fine for local use and
# not fine to redistribute.  FreeDoom is BSD-licensed, so a build regenerated
# from it can be published.  Same code, same script, different artwork.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: write

env:
  RENPY_VERSION: "8.5.3"
  FREEDOOM_VERSION: "0.13.0"

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the asset pipeline
        run: python -m pip install -r requirements.txt

      - uses: ./.github/actions/setup-renpy
        with:
          version: ${{ env.RENPY_VERSION }}

      - name: Check the tag against config.version
        run: |
          python - <<'PY'
          import os, re, sys
          from pathlib import Path

          tag = os.environ.get("TAG", "").lstrip("v")
          text = Path("game/options.rpy").read_text(encoding="utf-8")
          match = re.search(r'define config\.version = "([^"]+)"', text)
          if not match:
              sys.exit("could not find config.version in game/options.rpy")
          version = match.group(1)
          print(f"tag={tag!r} config.version={version!r}")
          if tag != version:
              sys.exit(f"tag {tag!r} does not match config.version {version!r}")
          PY
        env:
          TAG: ${{ github.ref_name }}

      - name: Fetch FreeDoom
        run: |
          set -euo pipefail
          url="https://github.com/freedoom/freedoom/releases/download/v${FREEDOOM_VERSION}/freedoom-${FREEDOOM_VERSION}.zip"
          curl -fsSL --retry 3 -o freedoom.zip "$url"
          python - <<'PY'
          import os, zipfile
          with zipfile.ZipFile("freedoom.zip") as z:
              name = next(n for n in z.namelist() if n.endswith("freedoom2.wad"))
              z.extract(name, "freedoom")
              os.replace(os.path.join("freedoom", name), "freedoom2.wad")
          print("freedoom2.wad extracted")
          PY

      - name: Rebuild the assets from FreeDoom
        run: |
          python tools/build_assets.py --iwad freedoom2.wad --out . 
          python tools/gen_images_rpy.py
          python tools/verify_assets.py

      - name: Lint the FreeDoom build
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          "$RENPY_SH" . lint 2>&1 | tee lint.log
          grep -q "dialogue blocks" lint.log

      - name: Build every package
        run: |
          set -o pipefail
          "$RENPY_SH" "$RENPY_SDK/launcher" distribute . \
            --destination dist \
            --no-update \
            --package win \
            --package linux \
            --package mac \
            2>&1 | tee build.log

      - name: Confirm the build no longer contains retail assets
        run: |
          set -euo pipefail
          # The manifest records the IWAD a build came from; make sure the
          # packaged game says FreeDoom and not DOOM2.
          python - <<'PY'
          import glob, json, sys, zipfile

          for path in sorted(glob.glob("dist/*.zip")):
              with zipfile.ZipFile(path) as z:
                  names = [n for n in z.namelist() if n.endswith("wad_manifest.json")]
                  if not names:
                      continue
                  manifest = json.loads(z.read(names[0]).decode("utf-8"))
                  iwad = manifest["iwad"]["file"].lower()
                  print(f"{path}: packaged IWAD = {iwad}")
                  if "freedoom" not in iwad:
                      sys.exit(f"refusing to publish a build made from {iwad}")
                  break
          else:
              sys.exit("no package contained game/wad_manifest.json")
          PY

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<EOF
          Сборка DOOM: Испытательный срок ${TAG} из коммита ${SHA}.

          **Эта сборка сделана из FreeDoom.** Все спрайты, текстуры, звуки и
          музыка взяты из \`freedoom2.wad\` (лицензия BSD) и пересобраны
          конвейером из \`tools/\` прямо в CI. Она выглядит иначе, чем версия
          из DOOM2.WAD, зато её можно распространять.

          **Установка.** Распакуйте архив и запустите \`DOOM_Novell\`
          (\`DOOM_Novell.sh\` на Linux, \`DOOM_Novell.app\` на macOS).

          **macOS.** Приложение не подписано; снимите карантин:
          \`xattr -cr DOOM_Novell.app\`

          **Хотите DOOM2?** Склонируйте репозиторий и соберите сами:
          \`python tools/build_assets.py --iwad DOOM2.WAD --out .\` — это
          остаётся личным использованием.

          **Лицензии.** Код и скрипты — MIT. Графика и звук в этом релизе —
          FreeDoom (BSD). Подробности в \`docs/ASSETS.md\`.

          **Проверено в CI:** lint, self-тест декодеров WAD, проверка
          согласованности ассетов и сквозной smoke-тест от главного меню до
          титров.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::distribute produced no packages"
            exit 1
          fi
          ls -lh dist

          # Re-running on an existing tag should update the assets, not fail.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${files[@]}" \
              --title "DOOM: Испытательный срок $TAG (FreeDoom)" \
              --notes-file notes.md
          fi
